<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiona</title>
    <style>
        :root {
            /* Brand New Cosmic-Neon Palette */
            --bg-1: #0a051b;
            --bg-2: #0f0728;
            --bg-3: #18093c;
            --card-bg: #140d2b;
            --box-bg: #1d143a;
            --text-primary: #ffffff;
            --text-secondary: #b3a9df;
            
            /* Fresh New Bullet Glow Colors */
            --glow-coral: #ff5e7e;
            --glow-neon: #a855f7;
            --glow-gold: #ffbe3b;
        }
        
        @keyframes meshBg { 
            0%, 100% { background-position: 0% 50% } 
            50% { background-position: 100% 50% } 
        }
        @keyframes boxFloat { 
            0%, 100% { transform: translateY(0) } 
            50% { transform: translateY(-6px) } 
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3));
            background-size: 300% 300%; 
            animation: meshBg 12s ease infinite;
            color: var(--text-primary); 
            min-height: 100vh; 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        
        /* Main Glassmorphic Profile Card */
        .card { 
            background: var(--card-bg); 
            max-width: 450px; 
            width: 100%; 
            border-radius: 28px; 
            padding: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }
        
        .profile-header { text-align: center; margin-bottom: 32px; }
        
        /* Floating Profile Ring */
        .img { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            margin: 0 auto 20px; 
            border: 3px solid var(--glow-coral); 
            overflow: hidden; 
            box-shadow: 0 0 20px rgba(255, 94, 126, 0.3); 
        }
        .img img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 2.2rem; margin: 0 0 6px; font-weight: 800; letter-spacing: -0.02em; }
        .sub { font-size: 0.85rem; color: var(--glow-coral); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 18px; }
        p { font-size: 1rem; line-height: 1.6; color: var(--text-secondary); margin: 0; }
        
        .grid { display: flex; flex-direction: column; gap: 18px; }
        
        /* Redesigned Category Blocks */
        .category-box { 
            background: var(--box-bg); 
            border-radius: 22px; 
            padding: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.03); 
            animation: boxFloat 5s ease-in-out infinite; 
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .bx1 { animation-delay: 0s; }
        .bx2 { animation-delay: 0.3s; }
        .bx3 { animation-delay: 0.6s; }
        
        /* Modern Minimalist Banners */
        .box-title { 
            font-size: 0.9rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.08em; 
            padding: 8px 16px; 
            border-radius: 30px; 
            margin-bottom: 18px; 
            display: inline-block;
            color: #fff;
        }
        .title-hobbies { background: rgba(255, 94, 126, 0.15); color: var(--glow-coral); border: 1px solid rgba(255, 94, 126, 0.3); }
        .title-favorites { background: rgba(168, 85, 247, 0.15); color: var(--glow-neon); border: 1px solid rgba(168, 85, 247, 0.3); }
        .title-goals { background: rgba(255, 190, 59, 0.15); color: var(--glow-gold); border: 1px solid rgba(255, 190, 59, 0.3); }
        
        .list-items { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        .item-row { display: flex; align-items: center; gap: 14px; font-size: 1.05rem; font-weight: 500; color: var(--text-secondary); transition: color 0.2s; }
        
        /* NEW Geometric Diamond Bullets */
        .diamond-bullet { 
            font-size: 0.9rem; 
            line-height: 1; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .b-coral { color: var(--glow-coral); text-shadow: 0 0 10px rgba(255, 94, 126, 0.6); }
        .b-neon { color: var(--glow-neon); text-shadow: 0 0 10px rgba(168, 85, 247, 0.6); }
        .b-gold { color: var(--glow-gold); text-shadow: 0 0 10px rgba(255, 190, 59, 0.6); }
        
        /* Interactive Hover Transitions */
        .category-box:hover { 
            animation-play-state: paused; 
            transform: scale(1.03) translateY(-2px) !important; 
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.1);
            cursor: pointer; 
        }
        .category-box:hover .item-row { color: var(--text-primary); }
        .category-box:hover .diamond-bullet { transform: scale(1.2) rotate(90deg); }
    </style>
</head>
<body>
    <div class="card">
        <div class="profile-header">
            <div class="img">
                <img src="peo.jpeg" alt="Fiona">
            </div>
            <h1>Fiona</h1>
            <div class="sub">She / Her</div>
            <p>Hi, I'm Fiona! A person who can't live without my phone.</p>
            <div class="sub">bellow are the things i like</div>
        </div>
        
        <div class="grid">
            <!-- Box 1: Hobbies -->
            <div class="category-box bx1">
                <div class="box-title title-hobbies">Hobbies</div>
                <div class="list-items">
                    <div class="item-row"><span class="diamond-bullet b-coral">❖</span>Eating</div>
                    <div class="item-row"><span class="diamond-bullet b-coral">❖</span>Going out</div>
                    <div class="item-row"><span class="diamond-bullet b-coral">❖</span>Dancing</div>
                </div>
            </div>

            <!-- Box 2: Favorites -->
            <div class="category-box bx2">
                <div class="box-title title-favorites">Favorites</div>
                <div class="list-items">
                    <div class="item-row"><span class="diamond-bullet b-neon">❖</span>Phone</div>
                    <div class="item-row"><span class="diamond-bullet b-neon">❖</span>Coke</div>
                    <div class="item-row"><span class="diamond-bullet b-neon">❖</span>Musics</div>
                </div>
            </div>

            <!-- Box 3: Goals -->
            <div class="category-box bx3">
                <div class="box-title title-goals">Goals</div>
                <div class="list-items">
                    <div class="item-row"><span class="diamond-bullet b-gold">❖</span>More improvements</div>
                    <div class="item-row"><span class="diamond-bullet b-gold">❖</span>Successfull life</div>
                    <div class="item-row"><span class="diamond-bullet b-gold">❖</span>Honors</div>
                </div>
            </div>
        </div>
    </div>
</body>
                                            </html>
